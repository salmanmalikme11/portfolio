<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d18"/><stop offset="1" stop-color="#0f1626"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.2" r=".65"><stop offset="0" stop-color="#fb7185" stop-opacity=".35"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
</defs>
<rect width="400" height="225" fill="url(#bg)"/><rect width="400" height="225" fill="url(#grid)"/><rect width="400" height="225" fill="url(#glow)"/>
<g font-family="ui-monospace, Consolas, monospace">
<!-- app window -->
<rect x="62" y="18" width="276" height="164" rx="12" fill="#111827" stroke="#1f2937"/>
<path d="M62 40V30a12 12 0 0 1 12-12h252a12 12 0 0 1 12 12v10z" fill="#1f2937"/>
<circle cx="78" cy="29" r="4" fill="#f87171"/><circle cx="90" cy="29" r="4" fill="#fbbf24"/><circle cx="102" cy="29" r="4" fill="#34d399"/>
<text x="200" y="32" text-anchor="middle" font-size="8" fill="#6b7280">localhost:8501</text>
<text x="78" y="57" font-size="10" font-weight="bold" fill="#f3f4f6">Local LLM Chatbot</text>
<text x="78" y="68" font-size="7" fill="#6b7280">Running llama3 through Ollama</text>
<!-- user message -->
<circle cx="84" cy="86" r="6" fill="#fb7185"/>
<rect x="96" y="79" width="132" height="15" rx="6" fill="#1f2937"/><rect x="104" y="84" width="104" height="5" rx="2.5" fill="#9ca3af"/>
<!-- streaming assistant reply -->
<circle cx="84" cy="108" r="6" fill="#fbbf24"/>
<rect x="96" y="101" width="210" height="44" rx="8" fill="#1f2937"/>
<rect x="106" y="109" width="186" height="5" rx="2.5" fill="#6b7280"/><rect x="106" y="119" width="172" height="5" rx="2.5" fill="#6b7280"/>
<rect x="106" y="129" width="94" height="5" rx="2.5" fill="#6b7280"/><rect x="204" y="127" width="5" height="9" fill="#fb7185"/>
<text x="296" y="141" text-anchor="end" font-size="7" fill="#fb7185" fill-opacity=".8">streaming</text>
<!-- input -->
<rect x="78" y="156" width="244" height="18" rx="9" fill="#0b0f19" stroke="#fb7185" stroke-opacity=".6"/>
<text x="90" y="168" font-size="8" fill="#6b7280">Ask something...</text><path d="M304 160l10 5-10 5z" fill="#fb7185"/>
<!-- pills -->
<rect x="62" y="192" width="122" height="22" rx="11" fill="#fb7185" fill-opacity=".15" stroke="#fb7185" stroke-opacity=".5"/>
<g transform="translate(76 197)" fill="none" stroke="#fecdd3" stroke-width="1.3"><rect x="0" y="5" width="9" height="7" rx="1.5" fill="#fecdd3" stroke="none"/><path d="M2 5V3a2.5 2.5 0 0 1 5 0v2"/></g>
<text x="135" y="207" text-anchor="middle" font-size="10" fill="#fecdd3">runs locally</text>
<rect x="192" y="192" width="146" height="22" rx="11" fill="#fb7185" fill-opacity=".15" stroke="#fb7185" stroke-opacity=".5"/>
<text x="265" y="207" text-anchor="middle" font-size="10" fill="#fecdd3">Streamlit · Ollama</text>
</g>
</svg>
